<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sumit PDF Tools</title>
<style>
body{font-family:Arial,sans-serif;background:#eef4ff;margin:0;text-align:center;color:#172554}
header{background:#155eef;color:white;padding:25px}
h1{margin:0}
main{max-width:650px;margin:25px auto;padding:15px}
.card{background:white;padding:22px;margin:15px 0;border-radius:14px;box-shadow:0 3px 12px #ccd5e5}
button{background:#155eef;color:white;border:0;padding:12px 20px;border-radius:8px;cursor:pointer}
input{margin:15px;max-width:100%}
</style>
</head>
<body>
<header>
<h1>Sumit PDF</h1>
<p>Free Online PDF Tools</p>
</header>
<main>
<div class="card">
<h2>Image to PDF</h2>
<p>फोटो को PDF में बदलें</p>
<input type="file" id="images" accept="image/png,image/jpeg" multiple>
<br>
<button onclick="makePDF()">Convert to PDF</button>
<p id="msg"></p>
</div>
<div class="card">
<h2>Merge PDF</h2>
<p>कई PDF को जोड़ने की सुविधा जल्द आएगी।</p>
</div>
<div class="card">
<h2>Split PDF</h2>
<p>PDF को अलग-अलग करने की सुविधा जल्द आएगी।</p>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
async function makePDF(){
const files=document.getElementById('images').files;
const msg=document.getElementById('msg');
if(!files.length){msg.textContent='पहले फोटो चुनें।';return;}
msg.textContent='PDF बन रही है...';
try{
const {jsPDF}=window.jspdf;
const pdf=new jsPDF();
for(let i=0;i<files.length;i++){
const data=await new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=()=>resolve(reader.result);
reader.onerror=reject;
reader.readAsDataURL(files[i]);
});
if(i>0)pdf.addPage();
const img=new Image();
await new Promise((resolve,reject)=>{
img.onload=resolve;
img.onerror=reject;
img.src=data;
});
const w=pdf.internal.pageSize.getWidth();
const h=pdf.internal.pageSize.getHeight();
const scale=Math.min(w/img.width,h/img.height);
const iw=img.width*scale;
const ih=img.height*scale;
pdf.addImage(data,'JPEG',(w-iw)/2,(h-ih)/2,iw,ih);
}
pdf.save('Sumit-PDF.pdf');
msg.textContent='PDF डाउनलोड हो गई!';
}catch(e){msg.textContent='त्रुटि हुई। दोबारा कोशिश करें।';}
}
</script>
</body>
</html>
